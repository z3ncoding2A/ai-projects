# Voice assistant configuration. Loaded once by execution/config.py -> Settings.
# Modules receive a Settings object; they MUST NOT read this file independently.

[wake]
model = "jarvis"          # openWakeWord pretrained name OR path to a custom .onnx
threshold = 0.5               # detection confidence cutoff (0-1)
vad_threshold = 0.5           # openWakeWord built-in VAD gate (0 disables)
inference_framework = "onnx"  # "onnx" | "tflite"

[audio]
sample_rate = 16000
frame_size = 1280             # samples per wake inference (~80 ms @ 16 kHz)
input_device = ""             # "" = system default input

[recorder]
silence_ms = 700              # stop after this much continuous silence
min_speech_ms = 300           # discard utterances shorter than this
max_record_ms = 15000         # hard cap on a single utterance
vad_aggressiveness = 2        # webrtcvad aggressiveness: 0 (lax) .. 3 (strict)
start_grace_ms = 1500         # wait this long for speech to start, else abort

[whisper]
model = "small.en"            # faster-whisper model id
device = "cuda"               # "cuda" | "cpu"  (auto-falls back to cpu)
compute_type = "int8_float16" # cpu fallback forces "int8"
beam_size = 1                 # 1 = greedy = fastest
language = "en"

[llm]
provider = "gemini"
model = "gemini-3.1-flash-live-preview"  # Gemini Live API model
voice_name = "Kore"                      # Prebuilt TTS voice (e.g. Kore, Puck, Charon, Fenrir, Aoede)
silence_duration_ms = 800                # Server VAD: ms of silence before turn ends (500-800 recommended)
thinking_level = "minimal"               # minimal | low | medium | high (minimal = lowest latency)
inactivity_timeout_s = 15                # Seconds of silence before Jarvis goes back to sleep
# API key is read from GEMINI_API_KEY (.env), never stored here.

[tts]
engine = "piper"
model_path = "~/.local/share/piper/en_US-lessac-high.onnx"
config_path = "~/.local/share/piper/en_US-lessac-high.onnx.json"
sample_rate = 22050
player = "aplay"              # "aplay" | "pw-play"

[ui]
enabled = true
window_class = "voice_assistant"  # must match the hyprland windowrule class:^(...)$
width = 500
height = 300

[logging]
level = "INFO"                # DEBUG | INFO | WARNING | ERROR
