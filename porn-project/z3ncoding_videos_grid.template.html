<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>z3ncoding Library (__TOTAL_VIDEOS_COUNT__)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base:          #08090b;
            --bg-surface:       #111318;
            --bg-card:          #161a22;
            --bg-card-hover:    #1e2330;
            --bg-topbar:        rgba(8,9,11,0.92);
            --text-primary:     #f0f2f5;
            --text-secondary:   #8b92a5;
            --text-muted:       #4a5068;
            --accent:           #e50914;
            --accent-glow:      rgba(229,9,20,0.35);
            --border:           rgba(255,255,255,0.07);
            --border-strong:    rgba(255,255,255,0.14);

            --cat-public:  #2ecc71;
            --cat-pending: #8b5cf6;
            --cat-least:   #7f8c9a;
            --cat-avg:     #3b82f6;
            --cat-most:    #f59e0b;
            --cat-explode: #ff2d78;

            --topbar-h: 56px;
            --list-w: 40%;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
        }

        /* ── TOP BAR ── */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--topbar-h);
            background: var(--bg-topbar);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 14px;
            z-index: 200;
            overflow-x: auto;
        }
        .top-bar::-webkit-scrollbar { display: none; }

        .brand {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--accent);
            white-space: nowrap;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .brand span { color: var(--text-secondary); font-weight: 400; }

        .tab-btn {
            flex-shrink: 0;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 20px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 5px 13px;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
        }
        .tab-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--border-strong);
        }
        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .tab-btn.tab-explode { color: var(--cat-explode); }
        .tab-btn.tab-explode.active { background: var(--cat-explode); border-color: var(--cat-explode); color: #fff; }
        .tab-btn.tab-most { color: var(--cat-most); }
        .tab-btn.tab-most.active { background: var(--cat-most); border-color: var(--cat-most); color: #fff; }
        .tab-btn.tab-public { color: var(--cat-public); }
        .tab-btn.tab-public.active { background: var(--cat-public); border-color: var(--cat-public); color: #fff; }
        .tab-btn.tab-pending { color: var(--cat-pending); }
        .tab-btn.tab-pending.active { background: var(--cat-pending); border-color: var(--cat-pending); color: #fff; }
        .tab-btn.tab-avg { color: var(--cat-avg); }
        .tab-btn.tab-avg.active { background: var(--cat-avg); border-color: var(--cat-avg); color: #fff; }
        .tab-btn.tab-least { color: var(--cat-least); }
        .tab-btn.tab-least.active { background: var(--cat-least); border-color: var(--cat-least); color: #fff; }

        .topbar-spacer { flex: 1; }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .topbar-actions button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.72rem;
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.18s;
        }
        .topbar-actions button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--border-strong);
        }

        /* ── MAIN LAYOUT ── */
        .app-layout {
            display: flex;
            height: calc(100vh - var(--topbar-h));
            margin-top: var(--topbar-h);
        }

        /* ── LEFT: VIDEO LIST PANEL ── */
        .list-panel {
            width: var(--list-w);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--bg-surface);
            overflow: hidden;
        }

        .resizer {
            width: 6px;
            cursor: col-resize;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
            transition: background-color 0.2s;
        }
        .resizer:hover, .resizer.active {
            background-color: var(--accent);
        }

        .list-controls {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-surface);
            flex-shrink: 0;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #search-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.8rem;
            padding: 7px 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        #search-input::placeholder { color: var(--text-muted); }
        #search-input:focus { border-color: var(--accent); }

        #sort-select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.75rem;
            padding: 7px 8px;
            outline: none;
            cursor: pointer;
        }

        .list-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            padding: 0 2px;
        }
        .list-meta b { color: var(--text-secondary); }

        .video-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            grid-auto-rows: max-content;
            gap: 5px;
            align-content: start;
        }
        .video-list::-webkit-scrollbar { width: 4px; }
        .video-list::-webkit-scrollbar-track { background: transparent; }
        .video-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

        /* sentinel needs to span full width to trigger intersection */
        #sentinel { grid-column: 1 / -1; height: 24px; }

        /* ── VIDEO GRID ITEM ── */
        .video-item {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border-radius: 7px;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            border: 2px solid transparent;
            background: var(--bg-card);
        }
        .video-item:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 24px rgba(0,0,0,0.55);
            border-color: var(--border-strong);
            z-index: 2;
        }
        .video-item.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .video-item.focused {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
            transform: scale(1.03);
            z-index: 2;
        }

        .item-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
        }
        .item-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .item-duration {
            position: absolute;
            bottom: 3px;
            right: 4px;
            background: rgba(0,0,0,0.82);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .item-cat-dot {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.6);
        }
        .item-play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s;
            font-size: 1.6rem;
        }
        .video-item:hover .item-play-overlay { opacity: 1; }

        /* Bottom bar: tiny title + cat buttons on hover */
        .item-info {
            padding: 4px 5px 3px;
            min-width: 0;
        }
        .item-title {
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .video-item.active .item-title { color: var(--accent); }
        .item-meta { display: none; }

        /* category action buttons — appear on hover */
        .item-actions {
            display: flex;
            gap: 2px;
            margin-top: 3px;
            opacity: 0;
            transition: opacity 0.18s;
            flex-wrap: wrap;
        }
        .video-item:hover .item-actions { opacity: 1; }
        .cat-btn {
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 4px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: #fff;
            font-family: inherit;
            line-height: 1.4;
        }
        .cat-btn:active { transform: scale(0.93); }
        .btn-public  { background: var(--cat-public); }
        .btn-pending { background: var(--cat-pending); }
        .btn-least   { background: var(--cat-least); }
        .btn-avg     { background: var(--cat-avg); }
        .btn-most    { background: var(--cat-most); }
        .btn-explode { background: var(--cat-explode); }
        .btn-reset   { background: #444; }
        .btn-delete  { background: #c0392b; }

        /* ── QUEUE WIDGET ── */
        .add-queue-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            width: 24px;
            height: 24px;
            font-size: 16px;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s, transform 0.1s;
            z-index: 10;
        }
        .video-item:hover .add-queue-btn { opacity: 1; }
        .add-queue-btn:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
        .add-queue-btn:active { transform: scale(0.95); }

        #queue-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            z-index: 1000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 320px;
        }
        #queue-widget.hidden { display: none; }

        .queue-header {
            background: var(--bg-surface);
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .queue-header:hover { background: var(--bg-card-hover); }
        
        .queue-toggle-icon {
            transition: transform 0.3s;
        }
        .queue-expanded .queue-toggle-icon { transform: rotate(180deg); }

        .queue-collapsed-preview {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
            cursor: pointer;
        }
        .queue-expanded .queue-collapsed-preview { display: none; }
        .queue-collapsed-preview:hover { background: var(--bg-card-hover); }
        .queue-collapsed-preview img {
            width: 60px;
            height: 34px;
            object-fit: cover;
            border-radius: 4px;
        }
        .queue-collapsed-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .queue-collapsed-title {
            font-size: 0.75rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .queue-collapsed-sub {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .queue-list-container {
            display: none;
            flex-direction: column;
            max-height: 350px;
            overflow-y: auto;
        }
        .queue-expanded .queue-list-container { display: flex; }

        .queue-list-container::-webkit-scrollbar { width: 4px; }
        .queue-list-container::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

        .queue-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }
        .queue-item:last-child { border-bottom: none; }
        .queue-item:hover { background: var(--bg-card-hover); }
        
        .queue-item img {
            width: 80px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
        }
        .queue-item-info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .queue-item-title {
            font-size: 0.75rem;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .queue-item-actions {
            display: flex;
            gap: 4px;
        }
        .q-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 0.65rem;
            cursor: pointer;
        }
        .q-btn:hover { background: var(--bg-card); color: #fff; border-color: var(--border-strong); }
        .q-btn-play:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* ── RIGHT: PLAYER PANEL ── */
        .player-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            overflow: hidden;
        }

        .player-frame-area {
            flex: 1;
            position: relative;
            background: #000;
        }
        .player-frame-area iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Empty state */
        .player-empty {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .player-empty .icon { font-size: 3.5rem; opacity: 0.25; }
        .player-empty p { font-size: 0.85rem; }

        /* Now-playing strip */
        .now-playing-bar {
            padding: 10px 15px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: none !important;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
            min-height: 48px;
        }
        .np-title {
            flex: 1;
            font-size: 0.83rem;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .np-title.empty { color: var(--text-muted); font-style: italic; font-weight: 400; }
        .np-link {
            flex-shrink: 0;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            transition: all 0.18s;
        }
        .np-link:hover { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-strong); }
        .np-link.hidden { display: none; }

        /* Gear / quality button */
        .quality-btn {
            position: absolute;
            bottom: 65px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            z-index: 100;
            transition: all 0.18s;
        }
        .quality-btn.visible { display: flex; }
        .quality-btn:hover { background: rgba(0, 0, 0, 0.9); }
        .quality-btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

        /* Quality Dropdown Menu */
        .quality-menu {
            display: none;
            position: absolute;
            bottom: 100%;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            padding: 4px 0;
            min-width: 100px;
            flex-direction: column;
            z-index: 200;
        }
        .quality-menu.show {
            display: flex;
        }
        .quality-item {
            padding: 8px 12px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-align: left;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: all 0.15s;
        }
        .quality-item:hover {
            background: var(--bg-card-hover);
            color: #fff;
        }
        .quality-item.active {
            color: var(--accent);
            font-weight: 600;
        }

        /* ── MODALS ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 500;
        }
        .modal-overlay.visible { display: block; }
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            padding: 24px;
            width: min(90vw, 480px);
            z-index: 600;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
        }
        .modal.visible { display: block; }
        .modal h2 { font-size: 1rem; margin-bottom: 14px; color: var(--text-primary); }
        .modal textarea {
            width: 100%;
            height: 200px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: monospace;
            font-size: 0.78rem;
            padding: 10px;
            resize: vertical;
            outline: none;
        }
        .modal-footer {
            margin-top: 14px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal-footer button {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.8rem;
            padding: 7px 16px;
            cursor: pointer;
            transition: all 0.18s;
        }
        .modal-footer button:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
        .modal-footer button.danger { background: #c0392b; border-color: #c0392b; }
        .modal-footer button.danger:hover { background: #e74c3c; border-color: #e74c3c; }

        /* sync status */
        .sync-chip {
            font-size: 0.68rem;
            padding: 3px 8px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .sync-chip.connected { border-color: var(--cat-public); color: var(--cat-public); }
        .sync-chip.saving    { border-color: var(--cat-avg); color: var(--cat-avg); }

        /* preview hover image on list item */
        .item-thumb-wrap .preview-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.25s;
        }
        .item-thumb-wrap:hover .preview-img { opacity: 1; }
    </style>
</head>
<body>

<!-- TOP BAR -->
<header class="top-bar">
    <div class="brand">z3ncoding <span>Library</span></div>
    <button class="tab-btn active"           id="tab-none"    onclick="setTab('none')">Main Collection</button>
    <button class="tab-btn tab-public"       id="tab-public"  onclick="setTab('public')">Public</button>
    <button class="tab-btn tab-pending"      id="tab-pending" onclick="setTab('pending')">Pending</button>
    <button class="tab-btn tab-least"        id="tab-least"   onclick="setTab('least')">Least Liked</button>
    <button class="tab-btn tab-avg"          id="tab-average" onclick="setTab('average')">Average</button>
    <button class="tab-btn tab-most"         id="tab-most"    onclick="setTab('most')">Most Liked</button>
    <button class="tab-btn tab-explode"      id="tab-explode" onclick="setTab('explode')">💥 EXPLODE!!!</button>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
        <span class="sync-chip disconnected" id="sync-status">⚠ Not connected</span>
        <button onclick="connectFolder()" id="connect-folder-btn">📁 Connect Folder</button>
        <button onclick="toggleModal('export-modal')">Export</button>
        <button onclick="toggleModal('blacklist-modal')">Blacklist</button>
        <button onclick="resetLocalStorage()" title="Reset browser data">🔄 Reset</button>
    </div>
</header>

<!-- MODALS -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModals()"></div>
<div class="modal" id="blacklist-modal">
    <h2>Local Blacklist</h2>
    <textarea id="blacklist-textarea" readonly></textarea>
    <div class="modal-footer">
        <button onclick="closeModals()">Close</button>
        <button class="danger" onclick="clearBlacklist()">Clear All</button>
    </div>
</div>
<div class="modal" id="export-modal">
    <h2>Export Categories JSON</h2>
    <textarea id="export-textarea" readonly></textarea>
    <div class="modal-footer">
        <button onclick="closeModals()">Close</button>
    </div>
</div>

<!-- MAIN APP LAYOUT -->
<div class="app-layout">

    <!-- LEFT: VIDEO LIST -->
    <aside class="list-panel">
        <div class="list-controls">
            <div class="search-row">
                <input type="text" id="search-input" placeholder="Search videos..." autocomplete="off">
                <select id="sort-select">
                    <option value="newest">Recently Scraped</option>
                    <option value="title-az">Title A-Z</option>
                    <option value="views-desc">Most Viewed</option>
                    <option value="duration-desc">Longest</option>
                </select>
            </div>
            <div class="list-meta"><b id="visible-count">0</b> / __TOTAL_VIDEOS_COUNT__ videos</div>
        </div>
        <div class="video-list" id="video-list">
            <!-- items injected by JS -->
            <div id="sentinel"></div>
        </div>
    </aside>

    <!-- RESIZER -->
    <div class="resizer" id="dragMe"></div>

    <!-- QUEUE WIDGET -->
    <div id="queue-widget" class="hidden">
        <div class="queue-header" onclick="toggleQueue()">
            <span>Video Queue</span>
            <span class="queue-toggle-icon">▲</span>
        </div>
        <div class="queue-collapsed-preview" id="queue-collapsed-preview" onclick="toggleQueue()">
            <!-- populated by JS -->
        </div>
        <div class="queue-list-container" id="queue-list-container">
            <!-- populated by JS -->
        </div>
    </div>

    <!-- RIGHT: PLAYER -->
    <main class="player-panel">
        <div class="player-frame-area" id="player-frame-area">
            <div class="player-empty" id="player-empty">
                <div class="icon">▶</div>
                <p>Select a video from the list to begin playing</p>
            </div>
            <div id="native-player-wrap" style="display:none; position:relative; width:100%; height:100%;">
                <video id="native-player" controls autoplay style="width:100%; height:100%; object-fit:contain; background:#000; display:block;"></video>
                <button class="quality-btn" id="quality-btn" title="Select quality" aria-label="Select quality">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a6.97 6.97 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.47.47 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.04.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    <span id="quality-label">Quality</span>
                    <div class="quality-menu" id="quality-menu"></div>
                </button>
            </div>
            <iframe id="player-iframe"
                    src="about:blank"
                    allowfullscreen
                    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
                    referrerpolicy="no-referrer"
                    style="display:none;">
            </iframe>
        </div>
        <div class="now-playing-bar">
            <div class="np-title empty" id="np-title">No video selected</div>
            <a class="np-link hidden" id="np-link" href="#" target="_blank" rel="noreferrer noopener">↗ Open on site</a>
        </div>
    </main>
</div>

<script>
    const ALL_VIDEOS = __VIDEOS_JSON_DATA__;

    // ── State ──
    let categories = {};
    let deleted    = new Set();
    let currentTab = 'none';
    let filteredVideos = [];
    let currentIndex   = 0;
    const BATCH_SIZE   = 50;
    let activePreviewWrap = null;
    let previewInterval   = null;

    // ── DOM refs ──
    const searchInput  = document.getElementById('search-input');
    const sortSelect   = document.getElementById('sort-select');
    const videoList    = document.getElementById('video-list');
    const visibleCount = document.getElementById('visible-count');
    const playerIframe = document.getElementById('player-iframe');
    const playerEmpty  = document.getElementById('player-empty');
    const npTitle      = document.getElementById('np-title');
    const npLink       = document.getElementById('np-link');
    const nativeWrap   = document.getElementById('native-player-wrap');
    const nativePlayer = document.getElementById('native-player');
    const qualityBtn   = document.getElementById('quality-btn');
    const qualityMenu  = document.getElementById('quality-menu');
    const qualityLabel = document.getElementById('quality-label');

    // Quality menu click handling
    if (qualityBtn && qualityMenu) {
        qualityBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            qualityMenu.classList.toggle('show');
        });
        document.addEventListener('click', () => {
            qualityMenu.classList.remove('show');
        });
    }

    // ── Load saved state ──
    try { categories = JSON.parse(localStorage.getItem('z3ncoding_categories') || '{}'); } catch(e) {}
    try { deleted    = new Set(JSON.parse(localStorage.getItem('z3ncoding_deleted') || '[]')); } catch(e) {}

    // ── Helpers ──
    function getCategoryColor(cat) {
        const map = { public:'var(--cat-public)', pending:'var(--cat-pending)', least:'var(--cat-least)', average:'var(--cat-avg)', most:'var(--cat-most)', explode:'var(--cat-explode)' };
        return map[cat] || 'transparent';
    }

    function getVideoCategory(vid) {
        const local = categories[vid[8]];
        if (local && local !== '') return local;
        const baked = vid[9];
        if (baked && baked !== '') return baked;
        return 'none';
    }

    function decodeHTMLEntities(str) {
        const t = document.createElement('textarea');
        t.innerHTML = str;
        return t.value;
    }

    // ── Build list item ──
    function createVideoItem(vid) {
        const item      = document.createElement('div');
        const viewkey   = vid[8];
        const cat       = getVideoCategory(vid);
        const dotColor  = getCategoryColor(cat);
        const safeTitle = vid[1].replace(/"/g, '&quot;');
        const safeUrl   = vid[2].replace(/"/g, '&quot;');

        item.className  = 'video-item';
        item.dataset.viewkey = viewkey;
        item.dataset.url     = safeUrl;
        item.dataset.title   = safeTitle;

        item.innerHTML = `
            <div class="item-thumb-wrap" data-preview="${vid[11]}">
                <button class="add-queue-btn" onclick="addToQueue(event, '${viewkey}')" title="Add to Queue">+</button>
                ${dotColor !== 'transparent' ? `<div class="item-cat-dot" style="background:${dotColor};"></div>` : ''}
                <img src="${vid[3]}" alt="" loading="lazy" onerror="this.style.display='none'">
                ${vid[4] ? `<span class="item-duration">${vid[4]}</span>` : ''}
                <div class="item-play-overlay">▶</div>
                <img class="preview-img" src="" alt="">
            </div>
            <div class="item-info">
                <div class="item-title" title="${safeTitle}">${vid[1]}</div>
                <div class="item-meta">${vid[6]}</div>
                <div class="item-actions" onclick="event.stopPropagation();">
                    <button class="cat-btn btn-public"  onclick="categorize('${viewkey}','public')">PUB</button>
                    <button class="cat-btn btn-pending" onclick="categorize('${viewkey}','pending')">PEND</button>
                    <button class="cat-btn btn-least"   onclick="categorize('${viewkey}','least')">MIN</button>
                    <button class="cat-btn btn-avg"     onclick="categorize('${viewkey}','average')">AVG</button>
                    <button class="cat-btn btn-most"    onclick="categorize('${viewkey}','most')">MAX</button>
                    <button class="cat-btn btn-explode" onclick="categorize('${viewkey}','explode')">💥</button>
                    <button class="cat-btn btn-reset"   onclick="categorize('${viewkey}','none')">↺</button>
                    <button class="cat-btn btn-delete"  onclick="deleteVideo('${viewkey}')">✕</button>
                </div>
            </div>
        `;
        item.addEventListener('click', (e) => {
            if (e.target.closest('.item-actions')) return;
            openVideoPlayer(item.dataset.url, item.dataset.title, viewkey);
        });
        return item;
    }

    // ── Render batch ──
    function renderNextBatch() {
        let sentinel = document.getElementById('sentinel');
        if (!sentinel) {
            sentinel = document.createElement('div');
            sentinel.id = 'sentinel';
            videoList.appendChild(sentinel);
        }
        const end = Math.min(currentIndex + BATCH_SIZE, filteredVideos.length);
        for (let i = currentIndex; i < end; i++) {
            videoList.insertBefore(createVideoItem(filteredVideos[i]), sentinel);
        }
        currentIndex = end;
    }

    // ── Filter + sort ──
    function filterAndSort() {
        const query    = searchInput.value.toLowerCase().trim();
        const sortMode = sortSelect.value;

        filteredVideos = ALL_VIDEOS.filter(vid => {
            const cat       = getVideoCategory(vid);
            const isDeleted = deleted.has(vid[8]);
            const matchTab  = (currentTab === 'none') ? !['public','pending','least','average','most','explode'].includes(cat)
                                                       : cat === currentTab;
            const matchQ    = query === '' || vid[10].includes(query);
            return !isDeleted && matchTab && matchQ;
        });

        if (sortMode === 'title-az')      filteredVideos.sort((a,b) => a[1].localeCompare(b[1]));
        else if (sortMode === 'views-desc')    filteredVideos.sort((a,b) => b[7]-a[7]);
        else if (sortMode === 'duration-desc') filteredVideos.sort((a,b) => b[5]-a[5]);
        else filteredVideos.sort((a,b) => a[0]-b[0]);

        videoList.innerHTML = '';
        currentIndex = 0;
        keyboardFocusedIndex = -1;
        visibleCount.textContent = filteredVideos.length;
        renderNextBatch();
    }

        // ── Infinite scroll ──
    // ── Infinite scroll via scroll event (IntersectionObserver breaks when innerHTML is cleared) ──
    videoList.addEventListener('scroll', () => {
        if (currentIndex >= filteredVideos.length) return;
        const distFromBottom = videoList.scrollHeight - videoList.scrollTop - videoList.clientHeight;
        if (distFromBottom < 400) renderNextBatch();
    });

    // ── Preview rotation on list item thumbnails ──
    videoList.addEventListener('mouseenter', e => {
        const wrap = e.target.closest('.item-thumb-wrap');
        if (wrap && wrap !== activePreviewWrap) startPreview(wrap);
    }, true);
    videoList.addEventListener('mouseleave', e => {
        const wrap = e.target.closest('.item-thumb-wrap');
        if (wrap) stopPreview(wrap);
    }, true);

    function startPreview(wrap) {
        const src = wrap.getAttribute('data-preview');
        if (!src || src === 'undefined' || src === 'null' || src === '') return;
        activePreviewWrap = wrap;
        const img = wrap.querySelector('.preview-img');
        if (!img) return;
        img.style.opacity = '1';

        const numMatch = src.match(/^(.+?)(\d+)(\.jpg)$/i);
        const vtsMatch = src.match(/vts:(\d+)/);
        let frame = 1, errors = 0;

        img.onerror = () => {
            errors++;
            if (errors > 4) {
                clearInterval(previewInterval);
                img.src = src;
                img.onerror = () => { img.style.opacity = '0'; };
                return;
            }
            frame = (frame % 16) + 1;
        };
        clearInterval(previewInterval);

        if (numMatch) {
            img.src = `${numMatch[1]}${frame}${numMatch[3]}`;
            previewInterval = setInterval(() => {
                frame = (frame % 16) + 1;
                img.src = `${numMatch[1]}${frame}${numMatch[3]}`;
            }, 500);
        } else if (vtsMatch) {
            const base = parseInt(vtsMatch[1]);
            img.src = src.replace(/vts:\d+/, `vts:${base + frame*20}`);
            previewInterval = setInterval(() => {
                frame = (frame % 16) + 1;
                img.src = src.replace(/vts:\d+/, `vts:${base + frame*20}`);
            }, 500);
        } else {
            img.src = src;
            img.onerror = () => { img.style.opacity = '0'; };
        }
    }

    function stopPreview(wrap) {
        clearInterval(previewInterval);
        previewInterval = null;
        activePreviewWrap = null;
        const img = wrap.querySelector('.preview-img');
        if (img) {
            img.style.opacity = '0';
            img.onerror = null;
            setTimeout(() => { if (img.style.opacity === '0') img.removeAttribute('src'); }, 250);
        }
    }

    // ── Tab switching ──
    function setTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const el = document.getElementById('tab-' + (tab === 'none' ? 'none' : tab));
        if (el) el.classList.add('active');
        videoList.innerHTML = '';
        setTimeout(filterAndSort, 0);
        videoList.scrollTop = 0;
    }

    // ── Categorise ──
    function categorize(vk, cat) {
        if (cat === 'none') delete categories[vk];
        else categories[vk] = cat;
        localStorage.setItem('z3ncoding_categories', JSON.stringify(categories));
        saveToFiles();
        // Update dot color for this item without full re-render
        const item = videoList.querySelector(`.video-item[data-viewkey="${vk}"]`);
        if (item) {
            const dot = item.querySelector('.item-cat-dot');
            const color = getCategoryColor(cat);
            if (dot) {
                dot.style.background = color;
                if (color === 'transparent') dot.remove();
            } else if (color !== 'transparent') {
                const wrap = item.querySelector('.item-thumb-wrap');
                const newDot = document.createElement('div');
                newDot.className = 'item-cat-dot';
                newDot.style.background = color;
                wrap.prepend(newDot);
            }
        }
        if (['public','least','average','most','explode'].includes(cat) && currentTab === 'none') {
            if (item) item.style.opacity = '0.4';
        }
    }

    function deleteVideo(vk) {
        if (confirm('Move to blacklist and hide from view?')) {
            deleted.add(vk);
            localStorage.setItem('z3ncoding_deleted', JSON.stringify([...deleted]));
            saveToFiles();
            filterAndSort();
        }
    }

    // ── Player ──
    let autoNextTimer = null;

    function buildEmbedUrl(url, viewkey) {
        // hd=1 requests highest available quality (1080p preferred), autoplay=1 to start playing immediately
        if (url.includes('pornhub.com')) return `https://www.pornhub.com/embed/${viewkey}?hd=1&autoplay=1`;
        if (url.includes('xhamster.com')) {
            const m = url.match(/videos\/[\w-]+-(\w+)$/) || url.match(/(\w+)$/);
            if (m) return `https://xhamster.com/xembed.php?video=${m[1]}&autoplay=1`;
        }
        return url;
    }

    function playNextVideo() {
        if (videoQueue.length > 0) {
            // Play from queue
            const nextVid = videoQueue[0];
            openVideoPlayer(nextVid[2], nextVid[1], nextVid[8]);
            // Remove from queue
            videoQueue.shift();
            renderQueueUI();
            return;
        }

        // Play next in current list
        const activeItem = document.querySelector('.video-item.active');
        if (activeItem) {
            const nextItem = activeItem.nextElementSibling;
            if (nextItem && nextItem.classList.contains('video-item')) {
                const nextViewkey = nextItem.dataset.viewkey;
                const nextVid = ALL_VIDEOS.find(v => v[8] === nextViewkey);
                if (nextVid) {
                    openVideoPlayer(nextVid[2], nextVid[1], nextVid[8]);
                }
            }
        }
    }

    function selectQuality(stream, forcePlay = false) {
        const currentTime = nativePlayer.currentTime;
        const wasPaused = nativePlayer.paused;
        
        nativePlayer.src = stream.url;
        qualityLabel.textContent = stream.quality;
        
        // Restore playhead position and playback state
        nativePlayer.addEventListener('loadedmetadata', function onMetadata() {
            nativePlayer.currentTime = currentTime;
            if (!wasPaused || forcePlay) nativePlayer.play();
            nativePlayer.removeEventListener('loadedmetadata', onMetadata);
        });
        
        // Highlight active quality item in menu
        document.querySelectorAll('.quality-item').forEach(btn => {
            if (btn.dataset.quality === stream.quality) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        
        qualityMenu.classList.remove('show');
    }

    async function openVideoPlayer(url, title, viewkey) {
        playerEmpty.style.display  = 'none';

        npTitle.textContent = decodeHTMLEntities(title);
        npTitle.classList.remove('empty');
        npLink.href = url;
        npLink.classList.remove('hidden');

        // Highlight active item
        document.querySelectorAll('.video-item').forEach(i => i.classList.remove('active'));
        const active = videoList.querySelector(`.video-item[data-viewkey="${viewkey}"]`);
        if (active) {
            active.classList.add('active');
            active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        if (autoNextTimer) clearTimeout(autoNextTimer);

        // Hide both player types initially
        playerIframe.src = 'about:blank';
        playerIframe.style.display = 'none';
        
        nativePlayer.src = '';
        nativeWrap.style.display = 'none';
        qualityBtn.classList.remove('visible');
        qualityMenu.innerHTML = '';
        qualityLabel.textContent = 'Quality';

        // 1. Try to fetch direct stream from python server
        try {
            const response = await fetch(`/api/streams?url=${encodeURIComponent(url)}`);
            if (!response.ok) throw new Error('API failed');
            
            const data = await response.json();
            if (data.streams && data.streams.length > 0) {
                const streams = data.streams;
                
                nativeWrap.style.display = 'block';
                qualityBtn.classList.add('visible');
                
                streams.forEach(stream => {
                    const btn = document.createElement('button');
                    btn.className = 'quality-item';
                    btn.dataset.quality = stream.quality;
                    btn.textContent = stream.quality;
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        selectQuality(stream);
                    };
                    qualityMenu.appendChild(btn);
                });
                
                selectQuality(streams[0], true);
                
                nativePlayer.onended = () => {
                    playNextVideo();
                };
                return; // Success!
            }
        } catch(e) {
            console.warn('Native streaming failed, falling back to iframe embed:', e);
        }

        // 2. Fallback to Iframe embed
        const embedUrl = buildEmbedUrl(url, viewkey);
        playerIframe.src = embedUrl || url;
        playerIframe.style.display = 'block';
        
        const vid = ALL_VIDEOS.find(v => v[8] === viewkey);
        if (vid && vid[4]) {
            const timeParts = vid[4].split(':');
            let durationSeconds = 0;
            if (timeParts.length === 3) { // hh:mm:ss
                durationSeconds = (parseInt(timeParts[0]) * 3600) + (parseInt(timeParts[1]) * 60) + parseInt(timeParts[2]);
            } else if (timeParts.length === 2) { // mm:ss
                durationSeconds = (parseInt(timeParts[0]) * 60) + parseInt(timeParts[1]);
            }
            
            if (durationSeconds > 0) {
                const durationMs = (durationSeconds + 2) * 1000;
                autoNextTimer = setTimeout(() => {
                    playNextVideo();
                }, durationMs);
            }
        }
    }

    // ── Modals ──
    function toggleModal(id) {
        if (id === 'export-modal')   document.getElementById('export-textarea').value   = JSON.stringify(categories, null, 2);
        if (id === 'blacklist-modal') document.getElementById('blacklist-textarea').value = [...deleted].join('\n');
        document.getElementById(id).classList.add('visible');
        document.getElementById('modal-overlay').classList.add('visible');
    }
    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('visible'));
        document.getElementById('modal-overlay').classList.remove('visible');
    }
    function clearBlacklist() {
        if (confirm('Clear entire blacklist? This cannot be undone.')) {
            deleted.clear();
            localStorage.setItem('z3ncoding_deleted', '[]');
            filterAndSort();
            closeModals();
        }
    }
    function resetLocalStorage() {
        if (confirm('Reset all browser-saved categories and blacklist?\nThe baked-in data from categories.json will be used instead.\n\nThis cannot be undone.')) {
            categories = {};
            deleted = new Set();
            localStorage.removeItem('z3ncoding_categories');
            localStorage.removeItem('z3ncoding_deleted');
            filterAndSort();
        }
    }

    // ── Search / sort listeners ──
    searchInput.addEventListener('input', () => {
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(() => { videoList.innerHTML=''; setTimeout(filterAndSort,0); }, 280);
    });
    sortSelect.addEventListener('change', () => { videoList.innerHTML=''; setTimeout(filterAndSort,0); });

    // ── File System Access API ──
    const DB_NAME  = 'z3ncoding_fsapi';
    const DB_STORE = 'handles';
    const DB_KEY   = 'projectDir';
    let dirHandle  = null;

    function openDB() {
        return new Promise((res, rej) => {
            const r = indexedDB.open(DB_NAME, 1);
            r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
            r.onsuccess = () => res(r.result);
            r.onerror   = () => rej(r.error);
        });
    }
    async function saveDirHandle(h) {
        const db = await openDB();
        const tx = db.transaction(DB_STORE,'readwrite');
        tx.objectStore(DB_STORE).put(h, DB_KEY);
        return new Promise((res,rej) => { tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
    }
    async function loadDirHandle() {
        const db = await openDB();
        const tx = db.transaction(DB_STORE,'readonly');
        const r  = tx.objectStore(DB_STORE).get(DB_KEY);
        return new Promise((res,rej) => { r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
    }

    function updateSyncUI(state, msg) {
        const el  = document.getElementById('sync-status');
        const btn = document.getElementById('connect-folder-btn');
        el.className = 'sync-chip ' + state;
        el.textContent = msg;
        if (state === 'connected' || state === 'saving') {
            btn.style.display = 'none';
        } else {
            btn.style.display = '';
            btn.textContent = '📁 Connect Folder';
        }
    }

    async function connectFolder() {
        if (location.protocol === 'file:') {
            alert('Run "python3 serve.py" to enable folder connection.');
            return;
        }
        if (!window.showDirectoryPicker) {
            alert('Your browser does not support the File System Access API. Please use Chrome or Edge.');
            return;
        }
        try {
            dirHandle = await window.showDirectoryPicker({ mode:'readwrite' });
            await saveDirHandle(dirHandle);
            updateSyncUI('connected','✓ Connected — auto-saving');
            await saveToFiles();
        } catch(err) {
            if (err.name !== 'AbortError') updateSyncUI('disconnected','⚠ ' + err.message);
        }
    }

    async function writeFile(h, name, content) {
        try {
            const fh = await h.getFileHandle(name, {create:true});
            const w  = await fh.createWritable();
            await w.write(content);
            await w.close();
            return true;
        } catch(e) { console.error('write',name,e); return false; }
    }
    async function readFile(h, name) {
        try {
            const fh = await h.getFileHandle(name);
            return await (await fh.getFile()).text();
        } catch(e) { return null; }
    }

    let saveTimeout = null;
    function saveToFiles() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(async () => {
            if (!dirHandle) return;
            try {
                const perm = await dirHandle.queryPermission({mode:'readwrite'});
                if (perm !== 'granted') {
                    const req = await dirHandle.requestPermission({mode:'readwrite'});
                    if (req !== 'granted') { updateSyncUI('disconnected','⚠ Permission denied'); dirHandle=null; return; }
                }
            } catch(e) { updateSyncUI('disconnected','⚠ Permission lost'); dirHandle=null; return; }

            updateSyncUI('saving','💾 Saving...');
            const merged = {};
            for (const v of ALL_VIDEOS) { if (v[9] && v[9] !== 'none') merged[v[8]] = v[9]; }
            Object.assign(merged, categories);
            for (const k of Object.keys(merged)) { if (merged[k]==='none') delete merged[k]; }

            const catOk = await writeFile(dirHandle,'categories.json', JSON.stringify(merged,null,2));
            const blOk  = await writeFile(dirHandle,'blacklist.txt', [...deleted].join('\n')+'\n');
            if (catOk && blOk) updateSyncUI('connected','✓ Saved — '+new Date().toLocaleTimeString());
            else updateSyncUI('disconnected','⚠ Write failed');
        }, 300);
    }

    async function loadFromDisk() {
        if (!dirHandle) return;
        try {
            const perm = await dirHandle.queryPermission({mode:'readwrite'});
            if (perm !== 'granted') { updateSyncUI('disconnected','🔄 Click Connect Folder to re-auth'); return; }
        } catch(e) { return; }

        const catText = await readFile(dirHandle,'categories.json');
        if (catText) {
            try {
                categories  = JSON.parse(catText);
                localStorage.setItem('z3ncoding_categories', JSON.stringify(categories));
            } catch(e) {}
        }
        const blText = await readFile(dirHandle,'blacklist.txt');
        if (blText) {
            const dDel = blText.split('\n').map(s=>s.trim()).filter(Boolean);
            deleted = new Set(dDel);
            localStorage.setItem('z3ncoding_deleted', JSON.stringify([...deleted]));
        }
        updateSyncUI('connected','✓ Connected — loaded from disk');
    }

    async function initFileSystem() {
        if (location.protocol === 'file:') {
            updateSyncUI('disconnected','⚠ Run serve.py for auto-save');
            return;
        }
        try {
            const saved = await loadDirHandle();
            if (saved) { dirHandle=saved; await loadFromDisk(); filterAndSort(); }
        } catch(e) {}
    }

    // ── Resizer Logic ──
    const resizer = document.getElementById('dragMe');
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        resizer.classList.add('active');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        document.getElementById('player-frame-area').style.pointerEvents = 'none'; // Prevent iframe from stealing mouse
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        let newWidth = (e.clientX / window.innerWidth) * 100;
        if (newWidth < 15) newWidth = 15;
        if (newWidth > 85) newWidth = 85;
        document.documentElement.style.setProperty('--list-w', `${newWidth}%`);
    });

    document.addEventListener('mouseup', () => {
        if (isResizing) {
            isResizing = false;
            resizer.classList.remove('active');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.getElementById('player-frame-area').style.pointerEvents = '';
        }
    });

    // ── Queue Logic ──
    let videoQueue = [];

    function addToQueue(e, viewkey) {
        e.stopPropagation();
        const vid = ALL_VIDEOS.find(v => v[8] === viewkey);
        if (!vid) return;
        if (!videoQueue.some(q => q[8] === viewkey)) {
            videoQueue.push(vid);
            renderQueueUI();
        }
    }

    function removeFromQueue(e, viewkey) {
        e.stopPropagation();
        videoQueue = videoQueue.filter(v => v[8] !== viewkey);
        renderQueueUI();
    }

    function playFromQueue(e, viewkey) {
        e.stopPropagation();
        const vid = videoQueue.find(v => v[8] === viewkey);
        if (vid) {
            openVideoPlayer(vid[2], vid[1], vid[8]);
            removeFromQueue(e, viewkey);
        }
    }

    function toggleQueue() {
        const widget = document.getElementById('queue-widget');
        widget.classList.toggle('queue-expanded');
    }

    function renderQueueUI() {
        const widget = document.getElementById('queue-widget');
        const collapsedPreview = document.getElementById('queue-collapsed-preview');
        const listContainer = document.getElementById('queue-list-container');
        
        if (videoQueue.length === 0) {
            widget.classList.add('hidden');
            widget.classList.remove('queue-expanded');
            return;
        }
        widget.classList.remove('hidden');

        // Collapsed UI
        const nextVid = videoQueue[0];
        collapsedPreview.innerHTML = `
            <img src="${nextVid[3]}" alt="">
            <div class="queue-collapsed-info">
                <div class="queue-collapsed-title">${nextVid[1]}</div>
                <div class="queue-collapsed-sub">Up Next (${videoQueue.length} in queue)</div>
            </div>
        `;

        // Expanded UI
        listContainer.innerHTML = '';
        videoQueue.forEach((vid) => {
            const el = document.createElement('div');
            el.className = 'queue-item';
            el.innerHTML = `
                <img src="${vid[3]}" onclick="playFromQueue(event, '${vid[8]}')">
                <div class="queue-item-info" onclick="playFromQueue(event, '${vid[8]}')">
                    <div class="queue-item-title">${vid[1]}</div>
                </div>
                <div class="queue-item-actions">
                    <button class="q-btn q-btn-play" onclick="playFromQueue(event, '${vid[8]}')" title="Play">▶</button>
                    <button class="q-btn" onclick="removeFromQueue(event, '${vid[8]}')" title="Remove">✕</button>
                </div>
            `;
            listContainer.appendChild(el);
        });
    }

    // ── Keyboard Navigation ──
    let keyboardFocusedIndex = -1;

    function getVisibleItems() {
        return Array.from(videoList.querySelectorAll('.video-item'));
    }

    function setKeyboardFocus(index) {
        const items = getVisibleItems();
        if (items.length === 0) return;
        
        items.forEach(el => el.classList.remove('focused'));
        
        if (typeof activePreviewWrap !== 'undefined' && activePreviewWrap) {
            stopPreview(activePreviewWrap);
        }
        
        if (index < 0) index = 0;
        if (index >= items.length) index = items.length - 1;
        
        keyboardFocusedIndex = index;
        const focusedItem = items[keyboardFocusedIndex];
        focusedItem.classList.add('focused');
        
        const newWrap = focusedItem.querySelector('.item-thumb-wrap');
        if (newWrap) startPreview(newWrap);
        
        // Scroll slightly past the element so we don't end up perfectly aligned with top/bottom bars hiding it partially
        focusedItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function getColumnsCount() {
        const items = getVisibleItems();
        if (items.length < 2) return 1;
        const firstTop = items[0].offsetTop;
        let cols = 0;
        for(let i=0; i<items.length; i++) {
            if (items[i].offsetTop === firstTop) cols++;
            else break;
        }
        return cols || 1;
    }

    document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;

        const items = getVisibleItems();
        if (items.length === 0) return;

        let cols = getColumnsCount();

        let keyChar = e.key;
        if (e.shiftKey && e.code && e.code.startsWith('Digit')) {
            keyChar = e.code.replace('Digit', '');
        }

        switch (keyChar) {
            case 'ArrowRight': e.preventDefault(); e.stopPropagation(); setKeyboardFocus(keyboardFocusedIndex + 1); break;
            case 'ArrowLeft':  e.preventDefault(); e.stopPropagation(); setKeyboardFocus(keyboardFocusedIndex - 1); break;
            case 'ArrowDown':  e.preventDefault(); e.stopPropagation(); setKeyboardFocus(keyboardFocusedIndex === -1 ? 0 : keyboardFocusedIndex + cols); break;
            case 'ArrowUp':    e.preventDefault(); e.stopPropagation(); setKeyboardFocus(keyboardFocusedIndex === -1 ? 0 : keyboardFocusedIndex - cols); break;
            case 'Enter':
                e.preventDefault();
                if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) {
                    const focusedItem = items[keyboardFocusedIndex];
                    openVideoPlayer(focusedItem.dataset.url, focusedItem.dataset.title, focusedItem.dataset.viewkey);
                }
                break;
            case 'k':
            case ' ':
                e.preventDefault();
                if (nativeWrap && nativeWrap.style.display !== 'none' && nativePlayer) {
                    if (nativePlayer.paused) nativePlayer.play();
                    else nativePlayer.pause();
                } else if (playerIframe && playerIframe.style.display !== 'none') {
                    playerIframe.contentWindow.postMessage(JSON.stringify({method: "togglePlay"}), "*");
                    playerIframe.contentWindow.postMessage(JSON.stringify({method: "play"}), "*");
                }
                break;
            case 'f':
                e.preventDefault();
                if (nativeWrap && nativeWrap.style.display !== 'none' && nativePlayer) {
                    if (!document.fullscreenElement) {
                        nativeWrap.requestFullscreen().catch(()=>{});
                    } else {
                        document.exitFullscreen();
                    }
                }
                break;
            case 'm':
                e.preventDefault();
                if (nativeWrap && nativeWrap.style.display !== 'none' && nativePlayer) {
                    nativePlayer.muted = !nativePlayer.muted;
                }
                break;
            case 'j':
                e.preventDefault();
                if (nativeWrap && nativeWrap.style.display !== 'none' && nativePlayer) {
                    nativePlayer.currentTime = Math.max(0, nativePlayer.currentTime - 10);
                }
                break;
            case 'l':
                e.preventDefault();
                if (nativeWrap && nativeWrap.style.display !== 'none' && nativePlayer) {
                    nativePlayer.currentTime = Math.min(nativePlayer.duration || 0, nativePlayer.currentTime + 10);
                }
                break;
            case 'Escape':
                e.preventDefault();
                items.forEach(el => el.classList.remove('focused'));
                keyboardFocusedIndex = -1;
                break;
            case '1': 
                e.preventDefault();
                if (e.shiftKey) setTab('none');
                else if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) categorize(items[keyboardFocusedIndex].dataset.viewkey, 'public'); 
                break;
            case '2': 
                e.preventDefault();
                if (e.shiftKey) setTab('public');
                else if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) categorize(items[keyboardFocusedIndex].dataset.viewkey, 'pending'); 
                break;
            case '3': 
                e.preventDefault();
                if (e.shiftKey) setTab('pending');
                else if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) categorize(items[keyboardFocusedIndex].dataset.viewkey, 'least'); 
                break;
            case '4': 
                e.preventDefault();
                if (e.shiftKey) setTab('least');
                else if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) categorize(items[keyboardFocusedIndex].dataset.viewkey, 'average'); 
                break;
            case '5': 
                e.preventDefault();
                if (e.shiftKey) setTab('average');
                else if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) categorize(items[keyboardFocusedIndex].dataset.viewkey, 'most'); 
                break;
            case '6': 
                e.preventDefault();
                if (e.shiftKey) setTab('most');
                else if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) categorize(items[keyboardFocusedIndex].dataset.viewkey, 'explode'); 
                break;
            case '7': 
                e.preventDefault();
                if (e.shiftKey) setTab('explode');
                break;
            case '0':
                e.preventDefault();
                if (!e.shiftKey && keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) categorize(items[keyboardFocusedIndex].dataset.viewkey, 'none');
                break;
            case 'Delete':
            case 'Backspace':
                if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) {
                    e.preventDefault();
                    const oldIndex = keyboardFocusedIndex;
                    deleteVideo(items[keyboardFocusedIndex].dataset.viewkey);
                    // Timeout ensures focus reapplies after delete re-renders grid
                    setTimeout(() => setKeyboardFocus(oldIndex), 50);
                }
                break;
            case 'q':
                if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < items.length) {
                    e.preventDefault();
                    addToQueue({stopPropagation: () => {}}, items[keyboardFocusedIndex].dataset.viewkey);
                }
                break;
        }
    }, true);

    // ── Boot ──
    filterAndSort();
    initFileSystem();
</script>
</body>
</html>
